---
strategy: polling
no_screen_padding: 'no'
dark_mode: 'no'
static_data: ''
polling_verb: get
framework_version: 3.4.6
serverless_language: node
refresh_interval_floor:
polling_url: |-
  https://api.open-meteo.com/v1/forecast?latitude={{ lat_lon | default: '52.52,13.41' | split: ',' | first | strip }}&longitude={{ lat_lon | default: '52.52,13.41' | split: ',' | last | strip }}&current=temperature_2m,apparent_temperature,relative_humidity_2m,wind_speed_10m,wind_direction_10m,wind_gusts_10m,pressure_msl,weather_code,is_day,uv_index&hourly=temperature_2m,apparent_temperature,precipitation_probability,precipitation,pressure_msl,weather_code,is_day,wind_speed_10m,wind_gusts_10m,uv_index,relative_humidity_2m&daily=weather_code,temperature_2m_max,temperature_2m_min,apparent_temperature_max,apparent_temperature_min,precipitation_probability_max,uv_index_max,wind_gusts_10m_max,precipitation_sum,sunrise,sunset&timezone=auto&past_hours=24&forecast_days=14{% if unit == 'fahrenheit' %}&temperature_unit=fahrenheit&precipitation_unit=inch&wind_speed_unit=mph{% else %}&temperature_unit=celsius&precipitation_unit=mm&wind_speed_unit=kmh{% endif %}
  https://air-quality-api.open-meteo.com/v1/air-quality?latitude={{ lat_lon | default: '52.52,13.41' | split: ',' | first | strip }}&longitude={{ lat_lon | default: '52.52,13.41' | split: ',' | last | strip }}&current=european_aqi,grass_pollen,birch_pollen,alder_pollen,mugwort_pollen,olive_pollen,ragweed_pollen&hourly=european_aqi,grass_pollen,birch_pollen,alder_pollen,mugwort_pollen,olive_pollen,ragweed_pollen&timezone=auto&forecast_days=2
polling_headers: ''
polling_body:
id: 535432
oauth_enabled: 'false'
oauth_pkce_enabled: 'no'
custom_fields:
- keyname: author_info
  name: About This Plugin
  field_type: author_bio
  description: 'The weather as a calm early-80s hi-fi receiver. A barometer dial with the pressure and its trend arrow, and a temperature dial with today''s low and high; big segment digits for the temperature with what to wear next to it (clothing for the coming hours, an umbrella when rain is on its way, sunglasses on sunny days); block meters for wind with gusts, UV, air quality, humidity, pollen and pressure when they matter; an hour calendar when rain is coming, sunrise, sunset and the moon otherwise; and the coming days or hours as a strip.<br /><br />With a TRMNL sensor it shows outdoor and indoor side by side. 1-bit, greyscale and colour screens; 24 or 12 hour time.<br /><br />Data: <strong>Open-Meteo</strong> (open-meteo.com)'
  description-de: 'Das Wetter als ruhiger Hi-Fi-Receiver der frühen 80er. Ein Barometer mit Luftdruck und Tendenzpfeil und ein Thermometer mit Tiefst- und Höchstwert von heute; große Segmentziffern für die Temperatur mit der passenden Kleidung daneben (für die nächsten Stunden, ein Schirm, wenn Regen kommt, eine Sonnenbrille an sonnigen Tagen); Balkenanzeigen für Wind mit Böen, UV, Luftqualität, Feuchte, Pollen und Luftdruck, wenn sie wichtig sind; ein Stundenkalender, wenn Regen kommt, sonst Sonnenaufgang, Sonnenuntergang und Mond; dazu die nächsten Tage oder Stunden als Leiste.<br /><br />Mit einem TRMNL-Sensor zeigt es außen und innen nebeneinander. 1-Bit-, Graustufen- und Farbdisplays; 24- oder 12-Stunden-Zeit.<br /><br />Daten: <strong>Open-Meteo</strong> (open-meteo.com)'
  description-fr: 'La météo comme un ampli hi-fi apaisé du début des années 80. Un baromètre avec la pression et une flèche de tendance, et un thermomètre avec le minimum et le maximum du jour ; de grands chiffres à segments pour la température avec quoi porter à côté (vêtements pour les prochaines heures, un parapluie quand la pluie arrive, des lunettes de soleil les jours ensoleillés) ; des jauges pour le vent avec rafales, l''UV, la qualité de l''air, l''humidité, le pollen et la pression quand ils comptent ; un calendrier horaire quand la pluie arrive, sinon lever, coucher du soleil et lune ; et les prochains jours ou heures en bandeau.<br /><br />Avec un capteur TRMNL, extérieur et intérieur côte à côte. Écrans 1 bit, niveaux de gris et couleur ; heure sur 24 ou 12 h.<br /><br />Données : <strong>Open-Meteo</strong> (open-meteo.com)'
  description-es-ES: 'El tiempo como un receptor hi-fi tranquilo de principios de los 80. Un barómetro con la presión y una flecha de tendencia, y un termómetro con la mínima y la máxima de hoy; grandes dígitos de segmentos para la temperatura con qué ponerse al lado (ropa para las próximas horas, un paraguas cuando llega la lluvia, gafas de sol en días soleados); medidores de viento con rachas, UV, calidad del aire, humedad, polen y presión cuando importan; un calendario por horas cuando llega la lluvia, si no amanecer, atardecer y luna; y los próximos días u horas en una franja.<br /><br />Con un sensor TRMNL muestra exterior e interior lado a lado. Pantallas de 1 bit, escala de grises y color; hora de 24 o 12 horas.<br /><br />Datos: <strong>Open-Meteo</strong> (open-meteo.com)'
  description-nl: 'Het weer als een rustige hifi-receiver uit de vroege jaren 80. Een barometer met de luchtdruk en een trendpijl, en een thermometer met de laagste en hoogste temperatuur van vandaag; grote segmentcijfers voor de temperatuur met ernaast wat je aantrekt (kleding voor de komende uren, een paraplu als er regen komt, een zonnebril op zonnige dagen); blokmeters voor wind met windstoten, UV, luchtkwaliteit, vocht, pollen en luchtdruk als ze ertoe doen; een urenkalender als er regen komt, anders zonsopkomst, zonsondergang en de maan; en de komende dagen of uren als strook.<br /><br />Met een TRMNL-sensor staan buiten en binnen naast elkaar. 1-bit-, grijs- en kleurenschermen; 24- of 12-uursklok.<br /><br />Gegevens: <strong>Open-Meteo</strong> (open-meteo.com)'
  description-ja: '80年代初頭のハイファイ・レシーバーのような落ち着いた天気表示。気圧と傾向の矢印付きの気圧計と、今日の最低・最高気温付きの温度計。大きなセグメント数字の気温の横に服装の目安（この先数時間の服、雨が近いときは傘、晴れの日はサングラス）。必要なときに風（突風）、UV、大気質、湿度、花粉、気圧のメーター。雨が来るときは時間ごとのカレンダー、それ以外は日の出・日の入りと月。下段には今後の日または時間。<br /><br />TRMNLセンサーがあれば屋外と屋内を並べて表示。1ビット・グレースケール・カラー画面、24時間または12時間表示に対応。<br /><br />データ: <strong>Open-Meteo</strong>（open-meteo.com）'
  github_url: https://github.com/ExcuseMi/trmnl-radio-weather-plugin
  category: environment
- keyname: lat_lon
  field_type: lat_lon
  name: Location
  description: Search for a city or postal code, or give latitude,longitude.
  description-de: Suche nach einer Stadt oder Postleitzahl, oder gib Breite,Länge an.
  description-fr: Cherche une ville ou un code postal, ou indique latitude,longitude.
  description-es-ES: Busca una ciudad o un código postal, o indica latitud,longitud.
  description-nl: Zoek een stad of postcode, of geef breedtegraad,lengtegraad.
  description-ja: 都市名か郵便番号で検索するか、緯度,経度を入力します。
  placeholder: 52.52,13.41
  default: 52.52,13.41
- keyname: unit
  group: Display
  field_type: select
  name: Temperature unit
  description: 'Celsius or Fahrenheit for every temperature on the screen.'
  description-de: 'Celsius oder Fahrenheit für alle Temperaturen auf dem Bildschirm.'
  description-fr: 'Celsius ou Fahrenheit pour toutes les températures à l''écran.'
  description-es-ES: 'Celsius o Fahrenheit para todas las temperaturas de la pantalla.'
  description-nl: 'Celsius of Fahrenheit voor alle temperaturen op het scherm.'
  description-ja: '画面のすべての温度を摂氏または華氏で表示します。'
  options:
  - Celsius: celsius
  - Fahrenheit: fahrenheit
  default: celsius
- keyname: time_format
  group: Display
  field_type: select
  name: Time format
  description: How times show on the screen (sunrise, sunset, rain hours).
  description-de: Wie Uhrzeiten auf dem Bildschirm erscheinen (Sonnenaufgang, Sonnenuntergang, Regenstunden).
  description-fr: Format des heures à l'écran (lever, coucher du soleil, heures de pluie).
  description-es-ES: Cómo se muestran las horas en la pantalla (amanecer, atardecer, horas de lluvia).
  description-nl: Hoe tijden op het scherm staan (zonsopkomst, zonsondergang, regenuren).
  description-ja: 画面の時刻の表示形式（日の出、日の入り、雨の時間）。
  options:
  - 24 hours (17:00): '24'
  - 12 hours (5:00 PM): '12'
  default: '24'
- keyname: bottom
  group: Display
  field_type: select
  name: Bottom strip
  description: The coming days, or the coming hours with their temperature; or both by the clock (hours until 18:00, days from 18:00).
  description-de: 'Die nächsten Tage oder die nächsten Stunden mit ihrer Temperatur; oder beides nach der Uhr (Stunden bis 18:00, Tage ab 18:00).'
  description-fr: 'Les prochains jours, ou les prochaines heures avec leur température ; ou les deux selon l''heure (heures jusqu''à 18:00, jours dès 18:00).'
  description-es-ES: 'Los próximos días, o las próximas horas con su temperatura; o ambos según la hora (horas hasta las 18:00, días desde las 18:00).'
  description-nl: 'De komende dagen, of de komende uren met hun temperatuur; of beide volgens de klok (uren tot 18:00, dagen vanaf 18:00).'
  description-ja: '今後の数日、または今後の数時間とその気温。時刻で切り替えることもできます（18:00までは時間、18:00からは日）。'
  options:
  - Days: days
  - Hours: hours
  - Hours, days after 18:00: auto
  default: auto
- keyname: hide_title_bar
  group: Display
  field_type: boolean
  name: Hide title bar
  description: 'Hide the bar with the plugin name and update time at the bottom.'
  description-de: 'Die Leiste mit Plugin-Name und Aktualisierungszeit unten ausblenden.'
  description-fr: 'Masquer la barre du bas avec le nom du plugin et l''heure de mise à jour.'
  description-es-ES: 'Ocultar la barra inferior con el nombre del plugin y la hora de actualización.'
  description-nl: 'De balk onderaan met de pluginnaam en de update-tijd verbergen.'
  description-ja: '下部のプラグイン名と更新時刻のバーを非表示にします。'
  default: false
- keyname: sensor_show
  group: Sensor
  field_type: select
  name: Indoor readings
  description: 'Show the indoor temperature and the room needle when a TRMNL sensor reports.'
  description-de: 'Innentemperatur und Raumzeiger anzeigen, wenn ein TRMNL-Sensor Werte meldet.'
  description-fr: 'Afficher la température intérieure et l’aiguille de la pièce lorsqu’un capteur TRMNL transmet des mesures.'
  description-es-ES: 'Mostrar la temperatura interior y la aguja de la habitación cuando un sensor TRMNL envía lecturas.'
  description-nl: 'Toon de binnentemperatuur en de kamerwijzer wanneer een TRMNL-sensor meetwaarden doorgeeft.'
  description-ja: 'TRMNLセンサーが測定値を送信すると、室内温度と室内の針を表示します。'
  options:
  - Show: show
  - Hide: hide
  default: show
- keyname: sensor_co2
  group: Sensor
  field_type: select
  name: CO2 meter
  description: 'Show the CO2 meter from a TRMNL sensor.'
  description-de: 'Den CO2-Messer eines TRMNL-Sensors anzeigen.'
  description-fr: 'Afficher la jauge de CO2 d’un capteur TRMNL.'
  description-es-ES: 'Mostrar el medidor de CO2 de un sensor TRMNL.'
  description-nl: 'Toon de CO2-meter van een TRMNL-sensor.'
  description-ja: 'TRMNLセンサーのCO2メーターを表示します。'
  options:
  - Show: show
  - Hide: hide
  default: show
name: Radio Weather
description: Weather as a vintage radio receiver
refresh_interval: 5
