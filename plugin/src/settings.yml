- keyname: author_info
  name: About This Plugin
  field_type: author_bio
  description: 'The weather as a calm early-80s hi-fi receiver. A barometer dial with the trend (rising, steady, falling) and a temperature dial with today''s low and high; big segment digits for the temperature with the felt temperature; what to wear (clothing icons, umbrella, sunglasses); block meters for wind with gusts, UV, air quality, humidity, pollen and pressure when they matter; an hour calendar when rain is coming, sunrise, sunset and the moon otherwise; and the coming days or hours as a strip.<br /><br />With a TRMNL sensor it shows outdoor and indoor side by side. 1-bit, greyscale and colour screens; 24 or 12 hour time.<br /><br />Data: <strong>Open-Meteo</strong> (open-meteo.com), no key needed.'
  description-de: 'Das Wetter als ruhiger Hi-Fi-Receiver der frühen 80er. Ein Barometer mit Tendenz (steigend, stabil, fallend) und ein Thermometer mit Tiefst- und Höchstwert von heute; große Segmentziffern für die Temperatur mit der gefühlten Temperatur; was man anzieht (Kleidung, Schirm, Sonnenbrille); Balkenanzeigen für Wind mit Böen, UV, Luftqualität, Feuchte, Pollen und Luftdruck, wenn sie wichtig sind; ein Stundenkalender, wenn Regen kommt, sonst Sonnenaufgang, Sonnenuntergang und Mond; dazu die nächsten Tage oder Stunden als Leiste.<br /><br />Mit einem TRMNL-Sensor zeigt es außen und innen nebeneinander. 1-Bit-, Graustufen- und Farbdisplays; 24- oder 12-Stunden-Zeit.<br /><br />Daten: <strong>Open-Meteo</strong> (open-meteo.com), kein Schlüssel nötig.'
  description-fr: 'La météo comme un ampli hi-fi apaisé du début des années 80. Un baromètre avec la tendance (en hausse, stable, en baisse) et un thermomètre avec le minimum et le maximum du jour ; de grands chiffres à segments pour la température et la température ressentie ; quoi porter (vêtements, parapluie, lunettes de soleil) ; des jauges pour le vent avec rafales, l''UV, la qualité de l''air, l''humidité, le pollen et la pression quand ils comptent ; un calendrier horaire quand la pluie arrive, sinon lever, coucher du soleil et lune ; et les prochains jours ou heures en bandeau.<br /><br />Avec un capteur TRMNL, extérieur et intérieur côte à côte. Écrans 1 bit, niveaux de gris et couleur ; heure sur 24 ou 12 h.<br /><br />Données : <strong>Open-Meteo</strong> (open-meteo.com), sans clé.'
  description-es-ES: 'El tiempo como un receptor hi-fi tranquilo de principios de los 80. Un barómetro con la tendencia (subiendo, estable, bajando) y un termómetro con la mínima y la máxima de hoy; grandes dígitos de segmentos para la temperatura y la sensación térmica; qué ponerse (ropa, paraguas, gafas de sol); medidores de viento con rachas, UV, calidad del aire, humedad, polen y presión cuando importan; un calendario por horas cuando llega la lluvia, si no amanecer, atardecer y luna; y los próximos días u horas en una franja.<br /><br />Con un sensor TRMNL muestra exterior e interior lado a lado. Pantallas de 1 bit, escala de grises y color; hora de 24 o 12 horas.<br /><br />Datos: <strong>Open-Meteo</strong> (open-meteo.com), sin clave.'
  description-nl: 'Het weer als een rustige hifi-receiver uit de vroege jaren 80. Een barometer met de trend (stijgend, stabiel, dalend) en een thermometer met de laagste en hoogste temperatuur van vandaag; grote segmentcijfers voor de temperatuur met de gevoelstemperatuur; wat je aantrekt (kleding, paraplu, zonnebril); blokmeters voor wind met windstoten, UV, luchtkwaliteit, vocht, pollen en luchtdruk als ze ertoe doen; een urenkalender als er regen komt, anders zonsopkomst, zonsondergang en de maan; en de komende dagen of uren als strook.<br /><br />Met een TRMNL-sensor staan buiten en binnen naast elkaar. 1-bit-, grijs- en kleurenschermen; 24- of 12-uursklok.<br /><br />Gegevens: <strong>Open-Meteo</strong> (open-meteo.com), geen sleutel nodig.'
  description-ja: '80年代初頭のハイファイ・レシーバーのような落ち着いた天気表示。傾向（上昇・安定・下降）付きの気圧計と、今日の最低・最高気温付きの温度計。大きなセグメント数字で気温と体感温度。服装の目安（服、傘、サングラス）。必要なときに風（突風）、UV、大気質、湿度、花粉、気圧のメーター。雨が来るときは時間ごとのカレンダー、それ以外は日の出・日の入りと月。下段には今後の日または時間。<br /><br />TRMNLセンサーがあれば屋外と屋内を並べて表示。1ビット・グレースケール・カラー画面、24時間または12時間表示に対応。<br /><br />データ: <strong>Open-Meteo</strong>（open-meteo.com）、キー不要。'
  github_url: https://github.com/ExcuseMi/trmnl-radio-weather-plugin
  category: environment
