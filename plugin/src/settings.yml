---
strategy: polling
no_screen_padding: 'yes'
dark_mode: 'no'
static_data: ''
polling_verb: get
framework_version: 3.4.6
serverless_language:
refresh_interval_floor:
polling_url: |-
  https://api.open-meteo.com/v1/forecast?latitude={{ lat_lon | split: ',' | first | strip }}&longitude={{ lat_lon | split: ',' | last | strip }}&current=temperature_2m,apparent_temperature,relative_humidity_2m,wind_speed_10m,wind_direction_10m,wind_gusts_10m,pressure_msl,weather_code,is_day,uv_index&hourly=temperature_2m,precipitation_probability,weather_code,is_day&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,uv_index_max,wind_gusts_10m_max,precipitation_sum,sunrise,sunset&timezone=auto&forecast_hours=48&forecast_days=14&temperature_unit={{ unit }}&wind_speed_unit={% if unit == 'fahrenheit' %}mph{% else %}kmh{% endif %}
  https://air-quality-api.open-meteo.com/v1/air-quality?latitude={{ lat_lon | split: ',' | first | strip }}&longitude={{ lat_lon | split: ',' | last | strip }}&current=european_aqi&hourly=european_aqi&timezone=auto&forecast_days=1
polling_headers: ''
polling_body:
id: 535432
oauth_enabled: 'false'
oauth_pkce_enabled: 'no'
custom_fields:
- keyname: author_info
  name: About This Plugin
  field_type: author_bio
  description: 'The weather as the front of an early-80s hi-fi receiver: a needle meter for the temperature now within today''s low and high, a needle meter for the chance of rain, a smoked-glass display with the temperature and the time the rain starts, and a key for each coming day.<br /><br />Data: <strong>Open-Meteo</strong> (open-meteo.com), no key needed.'
  github_url: https://github.com/ExcuseMi/trmnl-radio-weather-plugin
  category: environment
- keyname: lat_lon
  field_type: lat_lon
  name: Location
  description: Search for a city or postal code, or give latitude,longitude.
  description-de: Suche nach einer Stadt oder Postleitzahl, oder gib Breite,Länge an.
  description-fr: Cherche une ville ou un code postal, ou indique latitude,longitude.
  description-es-ES: Busca una ciudad o un código postal, o indica latitud,longitud.
  description-nl: Zoek een stad of postcode, of geef breedtegraad,lengtegraad.
  description-ja: 都市名か郵便番号で検索するか、緯度,経度を入力します。
  placeholder: 52.52,13.41
  default: 52.52,13.41
- keyname: unit
  field_type: select
  name: Temperature Unit
  options:
  - Celsius: celsius
  - Fahrenheit: fahrenheit
  default: celsius
- keyname: glass
  field_type: select
  name: Glass
  description: The display window in the middle. Dark is the fluorescent display of the receiver; light is an 80s LCD.
  description-nl: Het venster in het midden. Donker is het fluorescentiedisplay van de receiver; licht is een LCD uit de jaren 80.
  description-de: Das Fenster in der Mitte. Dunkel ist das Fluoreszenzdisplay des Receivers; hell ein LCD der 80er.
  description-fr: La vitre au milieu. Sombre, l'afficheur fluorescent du récepteur; clair, un LCD des années 80.
  options:
  - Dark (VFD): dark
  - Light (LCD): light
  default: dark
- keyname: hide_title_bar
  field_type: boolean
  name: Hide Title Bar
  default: false
name: Radio Weather
description: Weather as a vintage radio receiver
refresh_interval: 60
